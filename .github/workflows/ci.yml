name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: macos

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: brew install swiftlint swiftformat
      - name: SwiftFormat (lint mode)
        run: swiftformat --lint .
      - name: SwiftLint (strict)
        run: swiftlint --strict

  sidecar:
    name: Sidecar (TypeScript)
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos/Sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test

  build:
    name: Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build sidecar
        run: ./scripts/build-sidecar.sh
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: macos/build/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('macos/project.yml', 'macos/Hark/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-
      - name: Build (Debug)
        run: |
          set -o pipefail
          xcodebuild \
            -project Hark.xcodeproj \
            -scheme Hark \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Automatic \
            build

  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build sidecar
        run: ./scripts/build-sidecar.sh
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test (Debug)
        run: |
          set -o pipefail
          xcodebuild \
            -project Hark.xcodeproj \
            -scheme Hark \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Automatic \
            test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: macos/build/TestResults.xcresult
          retention-days: 7
