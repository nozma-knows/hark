included:
  - Hark
  - Tests
  - Sidecar

excluded:
  - Hark/Generated
  - Hark.xcodeproj
  - build
  - DerivedData
  - .build
  - Sidecar/node_modules
  - Sidecar/dist

disabled_rules:
  - trailing_whitespace      # swiftformat owns whitespace
  - opening_brace            # swiftformat owns brace style
  - todo                     # WIP notes are expected during build-out
  - multiple_closures_with_trailing_closure  # collides with SwiftUI ViewBuilder
  - identifier_name          # SwiftUI uses single-letter names a lot (e.g. `id`)

opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_in_static_references
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

analyzer_rules:
  - unused_declaration
  - unused_import

line_length:
  warning: 120
  error: 160
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 120

function_parameter_count:
  warning: 6
  error: 8

cyclomatic_complexity:
  warning: 12
  error: 20

nesting:
  type_level: 2

reporter: "xcode"
