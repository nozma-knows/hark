name: Hark

packages:
  # 2.4.0 requires swift-tools 6.1 (Xcode 16.3+); pinned to 2.3.x for Xcode 16.2.
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: "2.3.0"
  # On-device transcription via Apple Neural Engine — CoreML models downloaded
  # at runtime into ~/Library/Application Support/Hark/Models/.
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "1.0.0"
  # Auto-update framework. Appcast is hosted at dl.tellhark.com/appcast.xml
  # and signed with our EdDSA key (see scripts/release.sh).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.8.0"

options:
  bundleIdPrefix: co.milbo
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  groupSortPosition: top
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "16.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Defaults for CFBundleShortVersionString + CFBundleVersion. Override at
    # release time via release.sh's `MARKETING_VERSION="${VERSION}"` xcodebuild arg.
    MARKETING_VERSION: "0.1.8"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    # Warnings get treated as errors for the app target's Release builds
    # below. Debug stays permissive so day-to-day iteration doesn't fail
    # on a deprecation notice mid-edit. Set per-config because failing
    # Debug builds wedge `xcodebuild test` runs.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_COMPILATION_MODE: wholemodule
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    # User script sandboxing is OFF because the Bun-sidecar pre-build phase
    # reads/writes outside the sandboxed inputs/outputs (runs `bun install`,
    # touches node_modules). Hark is a developer tool, not a hardened app,
    # so this trade is acceptable for now.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      SWIFT_COMPILATION_MODE: incremental
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
      GCC_OPTIMIZATION_LEVEL: "0"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      ONLY_ACTIVE_ARCH: NO
      # Release builds are the artifact that ships to users — every
      # warning that survives to this point is a latent bug or a
      # deprecated API we should clean up before signing. Treat them
      # as errors so the release pipeline fails loudly instead of
      # quietly shipping warning-laden code.
      SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
      GCC_TREAT_WARNINGS_AS_ERRORS: YES
      GCC_OPTIMIZATION_LEVEL: s

targets:
  Hark:
    type: application
    platform: macOS
    sources:
      - path: Hark
        excludes:
          - Generated
          - Resources/Sidecar
      # The compiled Bun sidecar has no file extension, so XcodeGen wouldn't
      # auto-classify it as a resource. Explicit override puts it in the
      # Copy Bundle Resources phase. `optional: true` lets fresh clones
      # generate the project before the first sidecar build.
      - path: Hark/Resources/Sidecar
        buildPhase: resources
        optional: true
    dependencies:
      - package: KeyboardShortcuts
      - package: WhisperKit
      - package: Sparkle
    preBuildScripts:
      - name: Build Bun Sidecar
        path: scripts/build-sidecar.sh
        inputFiles:
          - $(SRCROOT)/Sidecar/src/index.ts
          - $(SRCROOT)/Sidecar/src/protocol.ts
          - $(SRCROOT)/Sidecar/package.json
          - $(SRCROOT)/Sidecar/bun.lock
        outputFiles:
          - $(SRCROOT)/Hark/Resources/Sidecar/hark-sidecar
        basedOnDependencyAnalysis: true
    postBuildScripts:
      # macOS Tahoe (26+) renders Assets.car-only icons through its "Liquid
      # Glass" compatibility layer — visible as a gray plate behind the
      # icon's actual shape. Apps that ship a hand-crafted AppIcon.icns
      # (Notes, Mail, Reminders) bypass that compatibility path. So we:
      #   1. Replace actool's auto-emitted truncated AppIcon.icns with the
      #      full-size one we generate from build-app-icon.swift (16…1024).
      #   2. Set CFBundleIconFile = AppIcon so macOS reads our .icns
      #      directly, instead of falling through to Assets.car.
      # The asset catalog AppIcon entry stays as a fallback (Spotlight,
      # Finder previews, etc. read from Assets.car).
      - name: Install full-size AppIcon.icns
        runOnlyWhenInstalling: false
        # `basedOnDependencyAnalysis: false` is the explicit "run every
        # build" opt-in; without it Xcode tries to cache based on inputs
        # AND we can't declare an outputFile because actool already
        # produces AppIcon.icns at the same path (multiple-producers
        # error). This phase runs after actool to overwrite that file.
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Hark/Resources/AppIcon.icns
        script: |
          set -euo pipefail
          INFO_PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          SRC_ICNS="${SRCROOT}/Hark/Resources/AppIcon.icns"
          DEST_ICNS="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/AppIcon.icns"
          if [ -f "${SRC_ICNS}" ]; then
            cp -f "${SRC_ICNS}" "${DEST_ICNS}"
            echo "icon: installed hand-crafted AppIcon.icns ($(stat -f%z "${DEST_ICNS}") bytes)"
          fi
          if [ -f "${INFO_PLIST}" ]; then
            plutil -replace CFBundleIconFile -string AppIcon "${INFO_PLIST}"
            echo "icon: CFBundleIconFile=AppIcon (direct .icns lookup)"
          fi
    info:
      path: Hark/Generated/Info.plist
      properties:
        CFBundleName: Hark
        CFBundleDisplayName: Hark
        # Tracks MARKETING_VERSION so release.sh's CLI override propagates
        # into Info.plist (Cmd+About, Spotlight, Sparkle appcast comparisons).
        # MARKETING_VERSION has a sensible default in settings.base below.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: APPL
        LSUIElement: false
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 Noah Milberger."
        NSMicrophoneUsageDescription: "Hark transcribes your dictation on-device to draft tickets."
        NSAppleEventsUsageDescription: "Hark opens Terminal to launch Claude Code sessions for created tickets."
        # Required by macOS Catalina+ (10.15) for any CGEventTap that reads
        # keyboard events — even with .listenOnly. Without this, our Fn
        # event tap installs successfully but receives ZERO events (silent
        # permission denial; AXIsProcessTrusted still returns true).
        NSInputMonitoringUsageDescription: "Hark listens for the Fn (globe) key globally to start dictation."
        # Sparkle auto-update configuration. SUFeedURL points at the appcast
        # we generate during release.sh. SUPublicEDKey is the EdDSA public
        # key Sparkle verifies update signatures with — keep the private
        # key offline (only on the release machine).
        #
        # SECURITY: SUPublicEDKey MUST be populated before enabling automatic
        # checks. With an empty key, Sparkle silently disables signature
        # verification and would auto-install ANY DMG served at the feed URL
        # — including an attacker-controlled one. So we default
        # SUEnableAutomaticChecks to FALSE and gate it in UpdateManager.swift
        # behind a non-empty key check. To turn on auto-update:
        #   1. brew install --cask sparkle
        #   2. generate_keys                        (one-time)
        #   3. paste the printed public key into SUPublicEDKey below
        #   4. flip SUEnableAutomaticChecks to true
        SUEnableAutomaticChecks: true
        SUFeedURL: "https://dl.tellhark.com/appcast.xml"
        SUPublicEDKey: "rm7t+7FT9dT0LA7ooJ5fTHjb5erKX8kX270fmyMY5DM="
        SUScheduledCheckInterval: 86400
        NSHighResolutionCapable: true
        # Only CFBundleIconName — when CFBundleIconFile is also set, macOS
        # reads the (truncated, 14 KB) AppIcon.icns instead of the full
        # Assets.car asset, and renders the generic placeholder.
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.milbo.hark
        PRODUCT_NAME: Hark
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: Signing/Hark.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          # "Hark Dev" self-signed cert (scripts/setup-dev-signing.sh). Stable
          # across rebuilds so macOS TCC remembers Accessibility / Microphone
          # grants. CI overrides to ad-hoc via xcodebuild args.
          ENABLE_HARDENED_RUNTIME: NO
          CODE_SIGN_IDENTITY: "Hark Dev"
          DEVELOPMENT_TEAM: ""
        Release:
          # Public-distribution signing: notarizable Developer ID + hardened
          # runtime. The Developer ID Application cert is installed in the
          # login keychain (see reference_apple_developer.md).
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: HFBJTWK7B8
          OTHER_CODE_SIGN_FLAGS: "--timestamp"

  HarkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/HarkTests
    dependencies:
      - target: Hark
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Hark.app/Contents/MacOS/Hark
        PRODUCT_BUNDLE_IDENTIFIER: co.milbo.hark.tests
        GENERATE_INFOPLIST_FILE: YES
        # The C bridge wraps `fork(2)` (which Swift marks unavailable)
        # so signal-integration tests can spawn a child process that
        # actually raises a fatal signal. The bridging header lives
        # alongside the test sources.
        SWIFT_OBJC_BRIDGING_HEADER: Tests/HarkTests/include/HarkForkBridge.h

schemes:
  Hark:
    build:
      targets:
        Hark: all
        HarkTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HarkTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
