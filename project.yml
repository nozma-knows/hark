name: Hark

options:
  bundleIdPrefix: co.milbo
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  groupSortPosition: top
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "16.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_COMPILATION_MODE: wholemodule
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      SWIFT_COMPILATION_MODE: incremental
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
      GCC_OPTIMIZATION_LEVEL: "0"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      ONLY_ACTIVE_ARCH: NO
      GCC_OPTIMIZATION_LEVEL: s

targets:
  Hark:
    type: application
    platform: macOS
    sources:
      - path: Hark
        excludes:
          - Generated
    info:
      path: Hark/Generated/Info.plist
      properties:
        CFBundleName: Hark
        CFBundleDisplayName: Hark
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: APPL
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 Noah Milberger."
        NSMicrophoneUsageDescription: "Hark transcribes your dictation on-device to draft tickets."
        NSAppleEventsUsageDescription: "Hark opens Terminal to launch Claude Code sessions for created tickets."
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.milbo.hark
        PRODUCT_NAME: Hark
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  HarkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/HarkTests
    dependencies:
      - target: Hark
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Hark.app/Contents/MacOS/Hark
        PRODUCT_BUNDLE_IDENTIFIER: co.milbo.hark.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Hark:
    build:
      targets:
        Hark: all
        HarkTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HarkTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
